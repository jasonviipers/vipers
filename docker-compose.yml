services:
  db:
    image: postgres:18-alpine
    container_name: viipers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viipers
    ports:
      - "5432:5432"
    volumes:
      - viipers_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viipers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  viipers_pgdata:
